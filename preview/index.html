<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Chat Sort · 测试预览</title>
<style>body{margin:0;font:15px system-ui;background:#fafafa;color:#242424}main{max-width:1000px;margin:50px auto;padding:24px}h1{font-size:26px}small{color:#666}.layout{display:grid;grid-template-columns:350px 1fr;gap:24px}aside,article{background:white;border:1px solid #ddd;border-radius:16px;padding:20px}.group{margin-bottom:30px}.head{display:flex;justify-content:space-between;align-items:center}.threads{list-style:none;padding:0}.threads li{padding:12px;border-radius:9px}.threads li:nth-child(odd){background:#f6f6f6}button{padding:7px 12px;background:white;border:1px solid #ccc;border-radius:7px;cursor:pointer}button:hover{background:#eee}.menu{border:1px solid #ccc;border-radius:10px;box-shadow:0 5px 20px #0001;background:white;padding:8px;margin-top:8px;display:grid;gap:5px}.menu button{text-align:left;border:0}.note{padding:14px;background:#fff4cf;border-radius:8px;margin:20px 0}#error{color:#a00}code{font-size:13px}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style>
<main><h1>项目聊天排序</h1><div class="note">独立测试预览 · 使用虚构聊天，不是已接入的 Codex 客户端。</div><div class="layout"><aside id="projects"></aside><article><h2>验证四种排序与项目隔离</h2><p>点击项目右侧的三个点，再点击“排序方式”。</p><p>设置仅保存在本预览页面的浏览器存储中。刷新页面可验证恢复效果。</p><button id="update">模拟更新 10-汇总</button> <button id="reset">清除测试设置</button><p id="error" role="alert"></p><small>日期排序、数字自然排序、手动调整使用实际扩展源码。</small></article></div></main>
<script type="module">
import {createAddon} from '/src/addon.mjs';import{arrangeDialog}from'/src/arrange.mjs';
const storeKey='cps-demo-v1';let config=JSON.parse(localStorage.getItem(storeKey)||'{}');
const threads={a:{title:'10-汇总',createdAt:1000,updatedAt:3000},b:{title:'02-实验',createdAt:3000,updatedAt:1000},c:{title:'01-准备',createdAt:2000,updatedAt:2000},d:{title:'B-整理',createdAt:1000,updatedAt:2000},e:{title:'A-检索',createdAt:2000,updatedAt:1000}};
const groups=[{projectId:'demo-a',projectKind:'local',label:'示例项目 A',threadKeys:['a','b','c']},{projectId:'demo-b',projectKind:'local',label:'示例项目 B',threadKeys:['d','e']}];const scope={get:()=>null};
const addon=createAddon({account:()=> 'demo',read:()=>config,write:(_s,k,p)=>{const next={...config};if(p)next[k]=p;else delete next[k];localStorage.setItem(storeKey,JSON.stringify(next));config=next;render();},thread:(_g,k)=>threads[k],arrange:arrangeDialog,report:e=>document.querySelector('#error').textContent=e.message});
function btn(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b;}
function render(){const root=document.querySelector('#projects');root.replaceChildren();for(const g of addon.sortGroups(scope.get,groups)){const section=document.createElement('section');section.className='group';const head=document.createElement('div');head.className='head';const title=document.createElement('strong');title.textContent=g.label;const more=btn('⋯',()=>{section.querySelector('.menu')?.remove();const menu=document.createElement('div');menu.className='menu';const item=addon.menu(scope,g,[])[0];menu.append(btn(item.message.defaultMessage,()=>{menu.replaceChildren();for(const choice of item.submenu){if(choice.type==='separator')continue;menu.append(btn((choice.checked?'✓ ':'')+choice.message.defaultMessage,choice.onSelect));}}));section.append(menu);});more.setAttribute('aria-label',g.label+' 菜单');head.append(title,more);section.append(head);const ul=document.createElement('ul');ul.className='threads';for(const id of g.threadKeys){const li=document.createElement('li');li.textContent=threads[id].title;ul.append(li);}section.append(ul);root.append(section);}}
document.querySelector('#update').onclick=()=>{threads.a.updatedAt=99999;render();};document.querySelector('#reset').onclick=()=>{config={};localStorage.removeItem(storeKey);render();};render();
</script></html>
